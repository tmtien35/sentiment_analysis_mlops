name: MLOps Continuous Integration

# Trigger on pushes or pull requests to the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint_and_test:
    name: Lint & Test Pipeline
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repository code
    - name: Checkout Repository
      uses: actions/checkout@v3

    # 2. Setup Python 3.12 environment
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    # 3. Cache pip dependencies to speed up future CI builds
    - name: Cache Pip Dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # 4. Install exact pinned dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 5. Lint with flake8 to check for Python syntax errors and undefined names
    - name: Lint with Flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    # 6. Execute pytest suite (verifies cleaner, pipelines, and DAG syntax)
    - name: Run Pytest Suite
      run: |
        export PYTHONPATH=$PYTHONPATH:.
        python -m pytest ml/test_pipeline.py
